<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taps of Cat 🐱💗</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 15% 20%, #ffd9ed 0%, transparent 25%),
        radial-gradient(circle at 85% 15%, #ffb5d9 0%, transparent 30%),
        radial-gradient(circle at 50% 100%, #ff9dcc 0%, transparent 35%),
        linear-gradient(135deg, #ff79b8, #ffb5d9, #ffd2e7);
}

/* Главный блок */

.game {
    text-align: center;
    position: relative;
    z-index: 5;
}

h1 {
    margin: 0;
    color: white;
    font-size: 52px;
    font-weight: 900;
    text-shadow: 0 5px 15px rgba(170, 30, 100, .45);
}

.subtitle {
    margin-top: 5px;
    margin-bottom: 18px;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

/* Счётчик */

.counter {
    display: inline-block;
    padding: 10px 28px;
    margin-bottom: 18px;

    background: rgba(255,255,255,.85);
    border-radius: 30px;

    color: #d8327d;
    font-size: 24px;
    font-weight: 900;

    box-shadow: 0 8px 25px rgba(130, 20, 80, .2);
}

/* Кот */

.cat-button {
    border: 0;
    outline: none;
    cursor: pointer;

    padding: 25px 45px 22px;

    border-radius: 45px;

    background: rgba(255,255,255,.88);

    box-shadow:
        0 18px 45px rgba(120, 20, 80, .25),
        inset 0 0 20px rgba(255,255,255,.7);

    transition: transform .12s ease;
}

.cat-button:hover {
    transform: scale(1.04);
}

.cat-button:active {
    transform: scale(.90);
}

.cat {
    font-size: 155px;
    line-height: 1;

    filter: drop-shadow(0 8px 8px rgba(100,20,60,.15));

    transition: transform .12s;
}

.cat-button:active .cat {
    transform: rotate(-5deg) scale(.92);
}

.button-text {
    display: block;

    margin-top: 12px;

    color: #e23885;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 3px;
}

/* Маленькая надпись */

.purr {
    height: 35px;
    margin-top: 12px;

    color: white;
    font-size: 24px;
    font-weight: bold;

    text-shadow: 0 3px 8px rgba(130,20,80,.4);
}

/* ВЫПЛЫВАЮЩИЕ КОМПЛИМЕНТЫ */

.compliment {
    position: fixed;

    pointer-events: none;

    z-index: 100;

    padding: 10px 18px;

    border-radius: 25px;

    background: rgba(255,255,255,.94);

    color: #d72f7d;

    font-size: 20px;
    font-weight: 900;

    white-space: nowrap;

    box-shadow: 0 8px 25px rgba(130,20,80,.2);

    animation: complimentFly 1.8s ease-out forwards;
}

@keyframes complimentFly {

    0% {
        opacity: 0;
        transform:
            translate(-50%, 20px)
            scale(.5)
            rotate(-5deg);
    }

    15% {
        opacity: 1;
        transform:
            translate(-50%, 0)
            scale(1.05)
            rotate(2deg);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -180px)
            scale(1.15)
            rotate(-5deg);
    }
}

/* Сердечки */

.heart {
    position: fixed;

    pointer-events: none;

    z-index: 90;

    font-size: 30px;

    animation: heartFly 1.3s ease-out forwards;
}

@keyframes heartFly {

    0% {
        opacity: 1;
        transform: translateY(0) scale(.5);
    }

    50% {
        opacity: 1;
        transform: translateY(-70px) scale(1.2);
    }

    100% {
        opacity: 0;
        transform: translateY(-170px) scale(1.6);
    }
}

/* Лёгкое свечение */

.glow {
    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(255,255,255,.15);

    filter: blur(50px);

    pointer-events: none;
}

/* Телефон */

@media (max-width: 600px) {

    h1 {
        font-size: 36px;
    }

    .subtitle {
        font-size: 18px;
    }

    .cat {
        font-size: 110px;
    }

    .cat-button {
        padding: 20px 30px;
    }

    .button-text {
        font-size: 24px;
    }

    .compliment {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="game">

    <h1>🐱 Taps of Cat</h1>

    <div class="subtitle">
        Жмякай котика 💗
    </div>

    <div class="counter">
        Жмяков: <span id="count">0</span>
    </div>

    <br>

    <button class="cat-button" id="catButton">

        <!-- КОТИК -->
        <div class="cat">😺</div>

        <span class="button-text">
            ЖМЯКАЙ!
        </span>

    </button>

    <div class="purr" id="purr"></div>

</div>


<script>

let count = 0;


/* Комплименты */

const compliments = [

    "Ты супер! 💗",
    "Ты молодец! ✨",
    "Ты крутой! 😎",
    "Котик тобой гордится! 🐱",
    "У тебя всё получится! 💖",
    "Ты невероятный! 🌟",
    "Какой классный жмяк! 😺",
    "Мур-мур, ты лучший! 🐾",
    "Ты просто легенда! 🔥",
    "Котик говорит: ты классный! 💕",
    "Ещё один жмяк! 💗",
    "Ты делаешь этот сайт счастливее! 🌸",
    "Котик улыбается тебе! 😺",
    "Вот это жмяк! 💥",
    "Ты прекрасный человек! 💖",
    "Муррр... продолжай! 🐱",
    "Это был мощный жмяк! ⚡",
    "Котик одобряет! 👍🐱",
    "Ты красавчик! 😎",
    "Ещё! Ещё! Ещё! 💕"

];


const button = document.getElementById("catButton");
const counter = document.getElementById("count");
const purr = document.getElementById("purr");


/* Звук мурчания */

function makePurr() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audio = new AudioContext();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
        55,
        audio.currentTime
    );

    oscillator.frequency.linearRampToValueAtTime(
        48,
        audio.currentTime + 0.35
    );

    gain.gain.setValueAtTime(
        0.0001,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.08,
        audio.currentTime + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audio.currentTime + 0.4
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime + 0.4
    );

    setTimeout(() => {
        audio.close();
    }, 500);
}


/* Выпустить комплимент */

function createCompliment() {

    const compliment =
        document.createElement("div");

    compliment.className = "compliment";

    compliment.textContent =
        compliments[
            Math.floor(
                Math.random() * compliments.length
            )
        ];

    /*
       Появляется около котика,
       но каждый раз немного в другом месте
    */

    const x =
        window.innerWidth / 2 +
        (Math.random() * 300 - 150);

    const y =
        window.innerHeight / 2 +
        (Math.random() * 100 - 50);

    compliment.style.left = x + "px";
    compliment.style.top = y + "px";

    document.body.appendChild(compliment);

    setTimeout(() => {
        compliment.remove();
    }, 1800);
}


/* Сердечко */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "💗",
        "💕",
        "💖",
        "💓",
        "💞",
        "🐾"
    ];

    heart.textContent =
        hearts[
            Math.floor(
                Math.random() * hearts.length
            )
        ];

    heart.style.left =
        (Math.random() * 80 + 10) + "vw";

    heart.style.top =
        (Math.random() * 60 + 20) + "vh";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 1300);
}


/* ЖМЯК */

button.addEventListener("click", () => {

    count++;

    counter.textContent = count;


    /* Мурчание */

    makePurr();

    purr.textContent =
        "Муррррр... 🐱💗";

    setTimeout(() => {
        purr.textContent = "";
    }, 500);


    /* Выплывающий комплимент */

    createCompliment();


    /* Сердечки */

    createHeart();

    if (Math.random() > 0.5) {
        createHeart();
    }

});


</script>

</body>
</html>
