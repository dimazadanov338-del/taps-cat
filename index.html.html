<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taps of Cat 💗</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;position:relative;font-family:"Trebuchet MS",Arial,sans-serif;background:#ff73b7;color:white}

.cat-bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.04);filter:saturate(1.15) brightness(.92);z-index:0}
.pink-glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 48%,rgba(255,105,183,.28),rgba(255,63,157,.62) 72%),linear-gradient(135deg,rgba(255,105,181,.42),rgba(255,175,219,.35));mix-blend-mode:screen}
.pink-vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle,transparent 42%,rgba(210,38,125,.18) 100%)}

.counter{position:fixed;top:18px;left:24px;z-index:20;min-width:285px;height:78px;padding:8px 22px;display:flex;align-items:center;gap:16px;border:4px solid rgba(255,255,255,.9);border-radius:45px;background:rgba(255,88,171,.24);box-shadow:0 0 10px rgba(255,255,255,.95),0 0 26px rgba(255,121,194,.9),inset 0 0 20px rgba(255,255,255,.12);backdrop-filter:blur(4px)}
.paw{font-size:46px;line-height:1;filter:drop-shadow(0 0 7px white)}
.count{min-width:55px;font-size:43px;line-height:1;font-weight:900;text-shadow:0 0 5px white,0 0 16px #ffb8e1}
.heart-counter{font-size:38px;filter:drop-shadow(0 0 7px white)}

.title{position:fixed;top:105px;left:50%;transform:translateX(-50%);z-index:10;margin:0;font-size:clamp(28px,4vw,46px);color:white;text-shadow:0 0 8px white,0 0 22px #ff4ca5;white-space:nowrap}
.subtitle{position:fixed;top:158px;left:50%;transform:translateX(-50%);z-index:10;color:white;font-size:19px;font-weight:900;text-shadow:0 0 10px #e82c8d}

.tap-zone{position:fixed;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%);width:min(600px,70vw);height:min(620px,65vh);border:0;background:transparent;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.tap-zone:active{transform:translate(-50%,-50%) scale(.975)}

.cheek-lines{position:fixed;z-index:12;pointer-events:none;width:78px;height:50px}
.cheek-lines.left{left:calc(50% - min(265px,31vw));top:55%;transform:rotate(-8deg)}
.cheek-lines.right{left:calc(50% + min(190px,22vw));top:55%;transform:scaleX(-1) rotate(-8deg)}
.cheek-lines span{position:absolute;left:0;width:58px;height:7px;border-radius:10px;background:#ff79bb;box-shadow:0 0 7px #fff,0 0 16px #ff58ac}
.cheek-lines span:nth-child(1){top:5px}
.cheek-lines span:nth-child(2){top:20px;width:66px}
.cheek-lines span:nth-child(3){top:35px;width:52px}

.compliment{position:fixed;z-index:30;pointer-events:none;color:white;font-size:clamp(20px,3vw,34px);font-weight:900;text-shadow:0 0 5px #fff,0 0 15px #ff4eaa,0 0 28px #ff4eaa;white-space:nowrap;animation:complimentFly 2.1s ease-out forwards}
@keyframes complimentFly{
0%{opacity:0;transform:translate(-50%,25px) scale(.55) rotate(-7deg)}
12%{opacity:1;transform:translate(-50%,0) scale(1.08) rotate(3deg)}
65%{opacity:1}
100%{opacity:0;transform:translate(-50%,-220px) scale(1) rotate(-5deg)}
}

.heart{position:fixed;z-index:25;pointer-events:none;color:white;font-size:30px;text-shadow:0 0 10px #fff,0 0 20px #ff53aa;animation:heartFly 1.6s ease-out forwards}
@keyframes heartFly{
0%{opacity:0;transform:translate(0,0) scale(.4)}
20%{opacity:1}
100%{opacity:0;transform:translate(var(--dx),-190px) scale(1.5)}
}

.tap-button{position:fixed;z-index:20;left:50%;bottom:34px;transform:translateX(-50%);min-width:310px;min-height:115px;padding:15px 40px;border:5px solid white;border-radius:65px;background:rgba(255,62,160,.42);color:white;font-family:inherit;font-size:clamp(30px,4vw,46px);font-weight:900;letter-spacing:3px;text-shadow:0 0 5px white,0 0 18px #ff5db2;box-shadow:0 0 10px white,0 0 25px #ff61b3,inset 0 0 25px rgba(255,255,255,.12);cursor:pointer;transition:transform .1s ease}
.tap-button:hover{background:rgba(255,87,174,.58)}
.tap-button:active{transform:translateX(-50%) scale(.93)}
.paw-small{font-size:30px;margin:0 7px}
.purr{position:fixed;z-index:20;left:50%;bottom:155px;transform:translateX(-50%);color:white;font-size:23px;font-weight:900;text-shadow:0 0 10px #ff3e9b;pointer-events:none}
.spark{position:fixed;z-index:24;pointer-events:none;color:white;font-size:25px;text-shadow:0 0 10px white,0 0 20px #ff5db3;animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:scale(.5)}to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.4)}}

@media(max-width:700px){
.counter{top:10px;left:10px;min-width:185px;height:58px;padding:5px 14px;gap:8px;border-width:3px}
.paw{font-size:32px}.count{font-size:30px}.heart-counter{font-size:27px}
.title{top:78px}.subtitle{top:122px;font-size:16px}
.tap-button{min-width:245px;min-height:88px;bottom:18px}
.purr{bottom:115px}.cheek-lines{display:none}
}
</style>
</head>

<script>
let count=0;
let audioCtx=null;

const compliments=[
"Кис-кис! 💗","Муррр... 💕","Муррр... муррр... 🐱",
"Ты киса! 💗","Ты кисуля! 💕","Ты лапочка! 🌸",
"Ты миленькая! 💖","Мур-мур! 😽","Кис-кис-кис! 🐾",
"Какая ты милая! 💗","Ты прелесть! 🌷","Кисуля-красотуля! 💕",
"Муррр, кисуля! 🐱","Ты солнышко! ☀️💗","Мяу-мяу! 😺",
"Киска! 🐾💖","Моя хорошая! 💕","Ты чудо! ✨",
"Мур-мур-мур! 💗","Ты такая милая! 🌸","Кис-кис, моя кисуля! 💗"
];

const countEl=document.getElementById("count");
const tapZone=document.getElementById("tapZone");
const tapButton=document.getElementById("tapButton");
const purrEl=document.getElementById("purr");

function keySound(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 if(!audioCtx)audioCtx=new AC();
 if(audioCtx.state==="suspended")audioCtx.resume();
 const now=audioCtx.currentTime;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sine";
 o.frequency.setValueAtTime(610+Math.random()*50,now);
 o.frequency.exponentialRampToValueAtTime(310,now+.055);
 g.gain.setValueAtTime(.0001,now);
 g.gain.exponentialRampToValueAtTime(.095,now+.004);
 g.gain.exponentialRampToValueAtTime(.0001,now+.075);
 o.connect(g);g.connect(audioCtx.destination);
 o.start(now);o.stop(now+.08);
}

function createCompliment(){
 const el=document.createElement("div");
 el.className="compliment";
 el.textContent=compliments[Math.floor(Math.random()*compliments.length)];
 el.style.left=(innerWidth/2+(Math.random()*650-325))+"px";
 el.style.top=(innerHeight/2+(Math.random()*390-195))+"px";
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),2100);
}

function createHeart(){
 const el=document.createElement("div");
 el.className="heart";
 el.textContent=["♡","♥","💗","💕"][Math.floor(Math.random()*4)];
 el.style.left=(innerWidth/2+(Math.random()*800-400))+"px";
 el.style.top=(innerHeight/2+(Math.random()*500-250))+"px";
 el.style.setProperty("--dx",(Math.random()*160-80)+"px");
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),1600);
}

function createSpark(){
 const el=document.createElement("div");
 el.className="spark";
 el.textContent="✦";
 el.style.left=(innerWidth/2+(Math.random()*800-400))+"px";
 el.style.top=(innerHeight/2+(Math.random()*500-250))+"px";
 el.style.setProperty("--sx",(Math.random()*140-70)+"px");
 el.style.setProperty("--sy",(Math.random()*-160-30)+"px");
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),900);
}

function tap(){
 count++;
